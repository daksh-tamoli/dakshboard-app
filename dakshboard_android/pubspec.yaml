name: dakshboard_android
description: DAKSHboard — Your personal athletic performance dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP Client
  dio: ^5.4.0

  # Secure Token Storage
  flutter_secure_storage: ^9.0.0

  # Strava OAuth (in-app browser)
  flutter_web_auth_2: ^4.0.0

  # Local Database (offline mode)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # GPS & Maps — flutter_map uses OpenStreetMap (completely free, no API key)
  geolocator: ^12.0.0
  flutter_map: ^7.0.1
  latlong2: ^0.9.0

  # Charts (workout pace/hr streams)
  fl_chart: ^0.68.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Home Screen Widget
  home_widget: ^0.6.0

  # Share workout screenshot
  share_plus: ^9.0.0
  screenshot: ^3.0.0
  path_provider: ^2.1.0

  # Image loading (athlete avatar)
  cached_network_image: ^3.3.1

  # Shared Preferences
  shared_preferences: ^2.2.3

  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
